<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" type="text/css" href="calstyle.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1 class="heading">CALCULATOR USING JAVASCRIPT</h1>
    <center>
        <div class="elements">

        <input type="text" id="input" placeholder="0">
        <br>
        <br>
        <br>
        <div class="button">
            <div>
                <button class="ac">AC</button>
                <button class="del">DEL</button>
                <button class="operator">%</button>
                <button class="operator">/</button>
            </div>
            <br>
            <div>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">+</button>
            </div>
            <br>
        
        
            <div>
                <button>6</button>
                <button>5</button>
                <button>4</button>
                <button class="operator">-</button>
            </div>
            <br>
            <div>
                <button>3</button>
                <button>2</button>
                <button>1</button>
                <button class="operator">*</button>
            </div>
            <br>
            <div>
                <button>00</button>
                <button>0</button>
                <button class="operator">.</button>
                <button class="equal">=</button>
            </div>
        </div>
    </center>
</div>        
</body>
</html>
